name: Validate Ashes and Banners
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/engine.js
          node --check src/politics.js
          node --check src/app.js
          node --check src/period-board.js
          node --check src/verified-sites.js
          node --check src/archival-atlas-data.js
          node --check tests/engine.test.js
      - name: Run simulation tests
        run: npm test

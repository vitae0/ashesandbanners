name: Bundle verified archival maps
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch-archive-maps.py
      - .github/workflows/bundle-archival-maps.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real historical scans and provenance
        run: python scripts/fetch-archive-maps.py
      - name: Commit downloaded public-domain image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps/
          if ! git diff --cached --quiet; then
            git commit -m "Bundle public-domain 1939 Poland and 1935/1938 city map scans"
            git push
          fi

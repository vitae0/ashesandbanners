name: Generate Historic City Polygons
on:
  push:
    branches: [main]
    paths:
      - scripts/vectorize-historic-city-scans.py
      - .github/workflows/city-vectors.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace-historical-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic cartographic vectorizer
        run: python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.10,<5"
      - name: Trace actual historical street-map linework into SVG polygon coordinates
        run: python scripts/vectorize-historic-city-scans.py
      - name: Commit generated polygon-only map module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/historical-city-vectors.js
          if ! git diff --cached --quiet; then
            git commit -m "data(city): add source-traced city street-map ink polygons"
            git pull --rebase origin main
            git push
          fi

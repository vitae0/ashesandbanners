name: Build Historical Vector Geometry
on:
  push:
    branches: [main]
    paths:
      - scripts/build-historical-geometry.py
      - .github/workflows/historical-geometry.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS processing dependency
        run: python -m pip install 'shapely>=2,<3'
      - name: Build 1938 geographic geometry from CC BY 4.0 data
        run: python scripts/build-historical-geometry.py
      - name: Verify generated Poland polygon and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/historical-geometry.js
          if ! git diff --cached --quiet; then
            git commit -m "data(map): bundle sourced 1938 Central European vector borders (CC BY 4.0)"
            git push
          fi
